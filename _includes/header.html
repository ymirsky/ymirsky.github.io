<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>

    <nav class="site-nav" aria-label="Main">
      {%- for item in site.nav -%}
      <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.title | escape }}</a>
      {%- endfor -%}
      <a class="nav-link nav-link--lab" href="{{ site.lab_url }}">Offensive AI Lab <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
