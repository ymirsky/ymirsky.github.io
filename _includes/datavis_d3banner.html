<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js" defer></script>
<script>
  // Interactive banner: a swarm of particles that flees the cursor and, every 6 seconds, turns red
  // and swarms toward it instead. Draws into <svg id="d3banner">. With class "banner-fill" the svg
  // is sized by CSS (home-page hero); otherwise it is a full-width strip (course page).
  // ported from https://bl.ocks.org/mbostock/3231298
  // adapted from https://github.com/columbiaviz/columbiaviz.github.io
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('d3banner');
    if (!el || !window.d3) return;

    var fill = el.classList.contains('banner-fill');
    var host = fill ? el.parentElement : el;
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var svg = d3.select(el);
    var width, height, strength;

    function measure() {
      width = el.getBoundingClientRect().width;
      height = fill ? el.getBoundingClientRect().height : (width > 500 ? 300 : 180);
      strength = width > 500 ? 0.05 : 0.15;
      svg.attr('width', width).attr('height', height);
    }
    // In the wide hero the swarm sits to the right of the text; elsewhere it is centred.
    function centerX() { return width * (fill && width > 900 ? 0.72 : 0.5); }
    function centerY() { return height * (fill && width > 900 ? 0.44 : 0.5); }

    measure();

    var numNodes = 200;
    var nodes = d3.range(numNodes).map(function () {
      return { radius: Math.random() * 10 + 1, x: centerX() + (Math.random() - 0.5) * 60, y: centerY() + (Math.random() - 0.5) * 60 };
    });
    var root = nodes[0],
        colorBad = d3.scaleSequential(d3.interpolateOrRd),
        colorGood = d3.scaleSequential(d3.interpolateGreys);

    root.radius = 0;
    root.fx = fill && width > 900 ? centerX() - 150 : 100;
    root.fy = fill && width > 900 ? centerY() - 70 : 100;

    var toggle = -1;
    var forceX = d3.forceX(centerX()).strength(strength);
    var forceY = d3.forceY(centerY()).strength(strength);

    var simulation = d3.forceSimulation(nodes)
        .force('charge', d3.forceManyBody().strength(function (d, i) { return i ? 0 : -2000; }))
        .force('x', forceX)
        .force('y', forceY)
        .force('collision', d3.forceCollide().radius(function (d) { return d.radius; }))
        .alphaTarget(calm ? 0 : 0.3)
        .on('tick', ticked);

    var circles = svg.selectAll('circle')
        .data(nodes.slice(1))
        .join('circle')
        .attr('r', function (d) { return d.radius; })
        .attr('opacity', 0.7)
        .style('fill', function (d, i) { return colorGood(i / (numNodes * 2) + 0.2); });

    function ticked() {
      circles.attr('cx', function (d) { return d.x; }).attr('cy', function (d) { return d.y; });
    }

    function moveTo(p) {
      root.fx = p[0];
      root.fy = p[1];
      simulation.alphaTarget(0.3).restart();
    }
    d3.select(host)
        .on('pointermove', function (event) { moveTo(d3.pointer(event, el)); })
        .on('touchmove', function (event) { var t = d3.pointers(event, el)[0]; if (t) moveTo(t); }, { passive: true });

    if (!calm) {
      setInterval(function () {
        toggle = toggle * -1;
        simulation.force('charge').strength(function (d, i) { return i ? 0 : toggle * 2000; });
        circles.transition().duration(900)
            .style('fill', toggle > 0
              ? function (d, i) { return colorBad(i / (numNodes * 2) + 0.5); }
              : function (d, i) { return colorGood(i / (numNodes * 2) + 0.2); });
        simulation.alphaTarget(0.3).restart();
      }, 6000);
    }

    // Only animate while the banner is on screen.
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) simulation.alphaTarget(calm ? 0 : 0.3).restart();
        else simulation.stop();
      }).observe(el);
    }

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        var oldWidth = width;
        measure();
        if (Math.abs(width - oldWidth) < 1) return;
        forceX.x(centerX()).strength(strength);
        forceY.y(centerY()).strength(strength);
        simulation.alpha(0.5).restart();
      }, 150);
    });
  });
</script>
