<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-id">
      <p class="footer-name">{{ site.author.name | escape }}</p>
      <p class="footer-sub">AI Security Researcher · Ben-Gurion University · {{ site.author.email | escape }}</p>
    </div>
    <nav class="footer-links" aria-label="Elsewhere">
      <a href="{{ site.lab_url }}">Offensive AI Lab</a>
      <a href="{{ site.scholar_url }}">Google Scholar</a>
      {%- if site.minima.social_links.github %}
      <a href="https://github.com/{{ site.minima.social_links.github }}">GitHub</a>
      {%- endif %}
    </nav>
  </div>
  <div class="container footer-base">© {{ site.time | date: '%Y' }} {{ site.author.name | escape }}</div>
</footer>
